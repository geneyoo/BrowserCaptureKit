name: PhoneBrowser

options:
  bundleIdPrefix: com.geneyoo
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"

packages:
  BrowserCaptureKit:
    path: ..

targets:
  PhoneBrowser:
    type: application
    platform: iOS
    sources:
      - path: Sources
    dependencies:
      - package: BrowserCaptureKit
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Phone Browser
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        NSLocalNetworkUsageDescription: Phone Browser connects to a development relay on your local network.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.geneyoo.phonebrowser
        PRODUCT_NAME: PhoneBrowser
        TARGETED_DEVICE_FAMILY: 1
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: H32EKFDL92

  PhoneBrowserTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: PhoneBrowser
      - package: BrowserCaptureKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.geneyoo.phonebrowser-tests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: 1

schemes:
  PhoneBrowser:
    build:
      targets:
        PhoneBrowser: all
        PhoneBrowserTests: [test]
    run:
      config: Debug
    test:
      targets:
        - PhoneBrowserTests
      gatherCoverageData: false
