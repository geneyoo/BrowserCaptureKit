name: BrowserCaptureKitConformance

options:
  bundleIdPrefix: com.geneyoo
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"

packages:
  BrowserCaptureKit:
    path: ..

targets:
  BrowserCaptureKitConformanceHost:
    type: application
    platform: iOS
    sources:
      - path: Host
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.geneyoo.browsercapturekit.conformance
        PRODUCT_NAME: BrowserCaptureKitConformanceHost
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: 1
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: H32EKFDL92

  BrowserCaptureKitConformanceTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: BrowserCaptureKitConformanceHost
      - package: BrowserCaptureKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.geneyoo.browsercapturekit.conformance-tests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: 1

schemes:
  BrowserCaptureKitConformance:
    build:
      targets:
        BrowserCaptureKitConformanceHost: all
        BrowserCaptureKitConformanceTests: [test]
    test:
      targets:
        - BrowserCaptureKitConformanceTests
      gatherCoverageData: false
