name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.3.app
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Toolchain diagnostics
        run: |
          xcodebuild -version
          xcrun simctl list devices available
      - name: Build and test
        run: make verify
